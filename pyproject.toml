[project]
name = "tabstack-openwebui-tool"
version = "0.1.0"
description = "A native Open WebUI tool that gives a local model Tabstack Research and Extract."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "tabstack==2.8.5",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "pyright==1.1.414",
]

[tool.uv]
package = false

[tool.ruff]
# Open WebUI runs black (default 88 columns) on tool code when it is saved, so
# keeping to black style means the pasted file is stored unchanged.
line-length = 88
# Open WebUI runs tools on Python 3.11, so the pasted file must parse there.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["tabstack_tool.py", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
